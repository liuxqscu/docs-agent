spring.application.name=docs-agent

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Server Configuration
# Word 加载项场景建议固定端口：需与 manifest 的 SourceLocation 保持一致
server.port=18080
# 固定端口模式：关闭端口自适应，避免加载项地址与实际端口不一致
docpulse.server.port.auto-fallback=false
docpulse.server.port.max-offset=50
# SSL 证书配置：优先使用环境变量，其次使用项目根目录下的证书文件
server.ssl.key-store=${KEYSTORE_PATH:file:./keystore.p12}
server.ssl.key-store-password=${KEYSTORE_PASSWORD:123456}
server.ssl.key-store-type=PKCS12
server.ssl.enabled=true

# AI Model Configuration (Optional - can be overridden by frontend headers)
ai.model.api-key=${AI_API_KEY:}
ai.model.base-url=${AI_BASE_URL:https://api.siliconflow.cn/v1}
ai.model.model-name=${AI_MODEL_NAME:Qwen/Qwen3.5-397B-A17B}
ai.model.timeout-seconds=60
ai.model.summary-timeout-seconds=180
ai.model.chat-memory-size=10

# Agent Prompt Configuration
# 默认 Agent 类型: general, academic, business, technical, legal, creative, custom
agent.prompt.default-type=general
# 是否允许前端覆盖 Agent 类型
agent.prompt.allow-client-override=true
# 是否允许使用自定义提示词
agent.prompt.allow-custom-prompt=true

# Logging Configuration
logging.level.com.example.docs_agent=INFO
logging.level.com.example.docs_agent.service.DocumentContext=DEBUG
# 解决 Windows 控制台中文乱码 (与 JVM -Dfile.encoding=UTF-8 保持一致)
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%-40logger{39}) : %msg%n

# 忽略 favicon.ico 请求错误
spring.mvc.favicon.enabled=false